<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10180d"/>
      <stop offset="100%" stop-color="#1c2715"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ed158"/>
      <stop offset="100%" stop-color="#5a9e2f"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect x="8" y="8" width="984" height="544" rx="18" fill="none" stroke="#2e3d22" stroke-width="2"/>

  <!-- stacked image layers (read-only) -->
  <g>
    <rect x="360" y="330" width="280" height="30" rx="6" fill="#172011" stroke="#3b5a26" stroke-width="2"/>
    <rect x="375" y="300" width="250" height="30" rx="6" fill="#172011" stroke="#3b5a26" stroke-width="2"/>
    <rect x="390" y="270" width="220" height="30" rx="6" fill="#172011" stroke="#3b5a26" stroke-width="2"/>
  </g>

  <!-- three containers running on top -->
  <g fill="#1c2715" stroke="url(#accent)" stroke-width="3">
    <rect x="360" y="150" width="80" height="80" rx="10"/>
    <rect x="460" y="150" width="80" height="80" rx="10"/>
    <rect x="560" y="150" width="80" height="80" rx="10"/>
  </g>
  <!-- ">_" glyphs inside the containers -->
  <g fill="#8ed158" font-size="26" font-weight="700">
    <text x="378" y="198">&gt;_</text>
    <text x="478" y="198">&gt;_</text>
    <text x="578" y="198">&gt;_</text>
  </g>

  <!-- connectors from containers down to the layer stack -->
  <g stroke="#3b5a26" stroke-width="2.5">
    <line x1="400" y1="230" x2="400" y2="270"/>
    <line x1="500" y1="230" x2="500" y2="270"/>
    <line x1="600" y1="230" x2="600" y2="270"/>
  </g>

  <text x="500" y="430" text-anchor="middle" fill="#e3efd5" font-size="48" font-weight="700" letter-spacing="1">Concise Docker</text>
  <text x="500" y="466" text-anchor="middle" fill="#a9bd92" font-size="19">Containers, images &amp; Compose — explained with diagrams</text>
</svg>
